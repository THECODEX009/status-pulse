version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: statuspulse-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: statuspulse

  redis:
    image: redis:7-alpine
    container_name: statuspulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: statuspulse-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:5173
      - MONGO_URI=mongodb://mongodb:27017/statuspulse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=docker_prod_access_secret_12345
      - JWT_REFRESH_SECRET=docker_prod_refresh_secret_67890
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: statuspulse-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
